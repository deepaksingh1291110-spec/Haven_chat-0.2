# =====================================================================
# gradle.properties  (project ROOT folder)
# WHAT: Settings for the Gradle build tool itself.
# =====================================================================

# Memory the build is allowed to use.
# GitHub's free build machine has enough RAM for 2 GB.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries (the modern Android library family).
# Compose needs this. Do NOT remove.
android.useAndroidX=true

# Keep Kotlin code style the same as the official one.
kotlin.code.style=official

# Reuse results from earlier builds so rebuilds are faster.
org.gradle.caching=true
